name: Apply safe defaults patch

on:
  push:
    branches:
      - fix/safe-pruning-and-role-memory
    paths:
      - .github/patches/safe-defaults-0.1.2.files.tar.gz.b64

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract updated source files
        shell: bash
        run: |
          base64 --decode .github/patches/safe-defaults-0.1.2.files.tar.gz.b64 | tar -xz

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest

      - name: Commit applied changes
        shell: bash
        run: |
          rm -f .github/patches/safe-defaults-0.1.2.patch.gz.b64
          rm -f .github/patches/safe-defaults-0.1.2.files.tar.gz.b64
          rm -f .github/workflows/apply-safe-defaults.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use safe memory defaults and migrate legacy graphs"
          git push
