name: Apply safe defaults patch

on:
  push:
    branches: [fix/safe-pruning-and-role-memory]
    paths: [.github/workflows/apply-safe-defaults.yml]

permissions:
  contents: write

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply source migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def edit(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected source block not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          graph = "src/memnet_agent/graph.py"
          edit(graph,
              'EDGE_TYPE_WEIGHT = {"semantic": 1.0, "tag": 0.65, "temporal": 0.35, "inferred": 0.8}\n\n',
              '''EDGE_TYPE_WEIGHT = {"semantic": 1.0, "tag": 0.65, "temporal": 0.35, "inferred": 0.8}\n\nDEFAULT_DECAY_RATE = 0.98\nDEFAULT_DECAY_TIME_UNIT = 24 * 60 * 60.0\nDEFAULT_MERGE_THRESHOLD = 0.90\nDEFAULT_PRUNE_THRESHOLD = 0.025\nDEFAULT_MIN_RETAINED_NODES = 3\n\nLEGACY_DEFAULTS = {\n    "decay_rate": 0.85,\n    "decay_time_unit": 1.0,\n    "merge_threshold": 0.72,\n    "prune_threshold": 0.15,\n}\n\ndef migrate_legacy_defaults(config: dict) -> tuple[dict, bool]:\n    """Upgrade unsafe 0.1.x defaults without overriding custom tuning."""\n    normalized = dict(config)\n    legacy = all(\n        key in normalized\n        and math.isclose(float(normalized[key]), value, rel_tol=0.0, abs_tol=1e-12)\n        for key, value in LEGACY_DEFAULTS.items()\n    )\n    if legacy:\n        normalized.update(\n            decay_rate=DEFAULT_DECAY_RATE,\n            decay_time_unit=DEFAULT_DECAY_TIME_UNIT,\n            merge_threshold=DEFAULT_MERGE_THRESHOLD,\n            prune_threshold=DEFAULT_PRUNE_THRESHOLD,\n        )\n    return normalized, legacy\n\n''')

          edit(graph,
              '''        decay_rate: float = 0.85,\n        decay_time_unit: float = 1.0,\n        merge_threshold: float = 0.72,''',
              '''        decay_rate: float = DEFAULT_DECAY_RATE,\n        decay_time_unit: float = DEFAULT_DECAY_TIME_UNIT,\n        merge_threshold: float = DEFAULT_MERGE_THRESHOLD,''')
          edit(graph,
              '''        prune_threshold: float = 0.15,\n        max_tag_df_ratio: float = 0.18,''',
              '''        prune_threshold: float = DEFAULT_PRUNE_THRESHOLD,\n        min_retained_nodes: int = DEFAULT_MIN_RETAINED_NODES,\n        max_tag_df_ratio: float = 0.18,''')
          edit(graph,
              '''        if decay_time_unit <= 0:\n            raise ValueError("decay_time_unit must be positive")''',
              '''        if decay_time_unit <= 0:\n            raise ValueError("decay_time_unit must be positive")\n        if min_retained_nodes < 0:\n            raise ValueError("min_retained_nodes must be non-negative")''')
          edit(graph,
              '''        self.prune_threshold = prune_threshold\n        self.max_tag_df_ratio = max_tag_df_ratio''',
              '''        self.prune_threshold = prune_threshold\n        self.min_retained_nodes = int(min_retained_nodes)\n        self.max_tag_df_ratio = max_tag_df_ratio''')
          edit(graph,
              '''            if sims[i, j] >= self.merge_threshold\n        ]''',
              '''            if sims[i, j] >= self.merge_threshold\n            and self._merge_compatible(self.nodes[ids[i]], self.nodes[ids[j]])\n        ]''')
          edit(graph,
              '''        return merged\n\n    def _original_sources''',
              '''        return merged\n\n    @staticmethod\n    def _same_memory_scope(first: Node, second: Node) -> bool:\n        first_role = first.meta.get("role")\n        second_role = second.meta.get("role")\n        if first_role is not None or second_role is not None:\n            return first_role == second_role\n        return True\n\n    @classmethod\n    def _merge_compatible(cls, first: Node, second: Node) -> bool:\n        if first.meta.get("protected") or second.meta.get("protected"):\n            return False\n        return cls._same_memory_scope(first, second)\n\n    def _original_sources''')
          edit(graph,
              '            meta={"operation": "merge", "merged_node_ids": member_ids},',
              '            meta=self._merged_metadata(members, member_ids),')
          edit(graph,
              '''        self._rebuild_edge_indexes()\n        return merged\n\n    def _split_mixed''',
              '''        self._rebuild_edge_indexes()\n        return merged\n\n    @staticmethod\n    def _merged_metadata(members: list[Node], member_ids: list[str]) -> dict:\n        metadata = {"operation": "merge", "merged_node_ids": member_ids}\n        for key in ("role", "source", "category"):\n            values = {node.meta.get(key) for node in members if node.meta.get(key) is not None}\n            if len(values) == 1:\n                metadata[key] = values.pop()\n        if any(node.meta.get("protected") for node in members):\n            metadata["protected"] = True\n        return metadata\n\n    def _split_mixed''')
          edit(graph,
              '                    meta={"operation": "split", "parent_node_id": node.id},',
              '                    meta={**node.meta, "operation": "split", "parent_node_id": node.id},')
          edit(graph,
              '''    def _prune(self) -> int:\n        dead = {\n            nid\n            for nid, node in self.nodes.items()\n            if node.strength * (0.5 + 0.5 * node.confidence) < self.prune_threshold\n        }''',
              '''    def _prune(self) -> int:\n        candidates = []\n        for nid, node in self.nodes.items():\n            durable = node.meta.get("protected") or node.meta.get("role") == "knowledge"\n            quality = node.strength * (0.5 + 0.5 * node.confidence)\n            if not durable and quality < self.prune_threshold:\n                candidates.append((quality, node.access_count, node.last_accessed, nid))\n        max_prunable = max(0, len(self.nodes) - self.min_retained_nodes)\n        dead = {item[3] for item in sorted(candidates)[:max_prunable]}''')
          edit(graph,
              '''                if other and other.ntype != "synthesis":\n                    candidates.append''',
              '''                if (\n                    other\n                    and other.ntype != "synthesis"\n                    and self._same_memory_scope(node, other)\n                ):\n                    candidates.append''')
          edit(graph,
              '''                "prune_threshold": self.prune_threshold,\n                "max_tag_df_ratio": self.max_tag_df_ratio,''',
              '''                "prune_threshold": self.prune_threshold,\n                "min_retained_nodes": self.min_retained_nodes,\n                "max_tag_df_ratio": self.max_tag_df_ratio,''')
          edit(graph,
              '''            config = json.loads(metadata.get("config", "{}"))\n            net = cls(**config)''',
              '''            config, migrated = migrate_legacy_defaults(\n                json.loads(metadata.get("config", "{}"))\n            )\n            net = cls(**config)''')
          edit(graph,
              '''            net._rebuild_edge_indexes()\n            return net''',
              '''            net._rebuild_edge_indexes()\n            if migrated:\n                now = time.time()\n                for node in net.nodes.values():\n                    node.last_decayed = max(node.last_decayed, now)\n                net.log.append("migrated legacy 0.1.x memory defaults to safe daily decay")\n            return net''')

          memory = "src/memnet_agent/memory.py"
          edit(memory,
              'from .graph import EDGE_TYPE_WEIGHT, Edge, MemoryNet, Node, tokenize',
              'from .graph import EDGE_TYPE_WEIGHT, Edge, MemoryNet, Node, migrate_legacy_defaults, tokenize')
          edit(memory,
              '''        node_types: Iterable[str] | None = None,\n        reinforce: bool = True,''',
              '''        node_types: Iterable[str] | None = None,\n        exclude_roles: Iterable[str] | None = None,\n        reinforce: bool = True,''')
          edit(memory,
              '''        allowed = set(node_types) if node_types is not None else None\n        candidates = [\n            node for node in self.nodes.values() if allowed is None or node.ntype in allowed\n        ]''',
              '''        allowed = set(node_types) if node_types is not None else None\n        blocked_roles = set(exclude_roles or ())\n        candidates = [\n            node for node in self.nodes.values()\n            if (allowed is None or node.ntype in allowed)\n            and node.meta.get("role") not in blocked_roles\n        ]''')
          edit(memory,
              '''            # Relevance dominates; quality breaks ties without hiding weak but exact matches.\n            score = 0.76 * semantic_score + 0.16 * tag_score + 0.08 * quality''',
              '''            relevance = 0.82 * semantic_score + 0.18 * tag_score\n            score = relevance * (0.90 + 0.10 * quality)''')
          edit(memory,
              '''            "prune_threshold": self.prune_threshold,\n            "max_tag_df_ratio": self.max_tag_df_ratio,''',
              '''            "prune_threshold": self.prune_threshold,\n            "min_retained_nodes": self.min_retained_nodes,\n            "max_tag_df_ratio": self.max_tag_df_ratio,''')
          edit(memory,
              '        config = dict(payload.get("config") or {})\n        memory = cls(**config)',
              '        config, migrated = migrate_legacy_defaults(dict(payload.get("config") or {}))\n        memory = cls(**config)')
          edit(memory,
              '''        memory._rebuild_edge_indexes()\n        errors = memory.validate()''',
              '''        memory._rebuild_edge_indexes()\n        if migrated:\n            now = memory._now(None)\n            for node in memory.nodes.values():\n                node.last_decayed = max(node.last_decayed, now)\n            memory.log.append("migrated legacy 0.1.x memory defaults to safe daily decay")\n        errors = memory.validate()''')

          agent = "src/memnet_agent/agent.py"
          edit(agent,
              '''        remember_responses: bool = True,\n        top_k: int = 6,''',
              '''        remember_responses: bool = True,\n        include_assistant_memories: bool = False,\n        top_k: int = 6,''')
          edit(agent,
              '''        self.model: BaseModelAdapter = adapt_model(model, method=model_method)\n        self.memory = self._coerce_memory(memory)\n        self.storage_path = Path(storage_path) if storage_path is not None else None\n        if self.storage_path is None and isinstance(memory, (str, Path)):\n            source = Path(memory)''',
              '''        self.model: BaseModelAdapter = adapt_model(model, method=model_method)\n        self.storage_path = Path(storage_path) if storage_path is not None else None\n        memory_source = memory\n        if memory_source is None and self.storage_path is not None:\n            if self.storage_path.exists() and self.storage_path.stat().st_size > 0:\n                memory_source = self.storage_path\n        self.memory = self._coerce_memory(memory_source)\n        if self.storage_path is None and isinstance(memory_source, (str, Path)):\n            source = Path(memory_source)''')
          edit(agent,
              '''        self.remember_responses = bool(remember_responses)\n        self.top_k = int(top_k)''',
              '''        self.remember_responses = bool(remember_responses)\n        self.include_assistant_memories = bool(include_assistant_memories)\n        self.top_k = int(top_k)''')
          text = Path(agent).read_text(encoding="utf-8")
          text = text.replace(
              '''                    min_score=self.min_memory_score,\n                    reinforce=True,''',
              '''                    min_score=self.min_memory_score,\n                    exclude_roles=(None if self.include_assistant_memories else {"assistant"}),\n                    reinforce=True,''')
          Path(agent).write_text(text, encoding="utf-8")

          sleeping = "src/memnet_agent/sleeping.py"
          edit(sleeping, 'idle_after_seconds: float = 30.0', 'idle_after_seconds: float = 300.0')
          edit(sleeping, 'check_interval_seconds: float = 5.0', 'check_interval_seconds: float = 30.0')
          edit(sleeping, 'maintenance_interval_seconds: float = 30.0', 'maintenance_interval_seconds: float = 3600.0')
          edit(sleeping, 'max_syntheses: int = 3', 'max_syntheses: int = 1')
          edit(sleeping, 'after_seconds: float = 30.0', 'after_seconds: float = 300.0')
          edit(sleeping, 'check_every_seconds: float = 5.0', 'check_every_seconds: float = 30.0')
          edit(sleeping, 'maintenance_every_seconds: float = 30.0', 'maintenance_every_seconds: float = 3600.0')

          for path in ("pyproject.toml", "src/memnet_agent/version.py"):
              p = Path(path)
              p.write_text(p.read_text(encoding="utf-8").replace("0.1.1", "0.1.2"), encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          entry = '''# Changelog\n\n## 0.1.2 — 2026-08-06\n\n- Changed decay defaults from per-second to conservative daily decay.\n- Lowered pruning and retained a minimum graph core.\n- Protected explicit knowledge from pruning.\n- Migrated untouched 0.1.x defaults automatically on load.\n- Existing `storage_path` databases load automatically.\n- Prevented merges across user, assistant and knowledge roles.\n- Excluded assistant responses from retrieval by default.\n- Removed quality-only unrelated retrieval matches.\n\n'''
          changelog.write_text(entry + text.removeprefix("# Changelog\n\n"), encoding="utf-8")

          tests = Path("tests/test_memory.py")
          tests.write_text(tests.read_text(encoding="utf-8") + r'''


def test_safe_defaults_do_not_prune_recent_memory() -> None:
    memory = AssociativeMemory()
    node = memory.add("A recent durable conversational memory", ts=100.0)
    result = memory.sleep(now=160.0, max_syntheses=0)
    assert result["pruned"] == 0
    assert node.id in memory.nodes
    assert memory.decay_time_unit == 86400.0


def test_explicit_knowledge_is_protected_from_pruning() -> None:
    memory = AssociativeMemory(prune_threshold=0.9, min_retained_nodes=0)
    node = memory.add("User name is Alexander", meta={"role": "knowledge", "protected": True})
    node.strength = 0.001
    memory.sleep(max_syntheses=0)
    assert node.id in memory.nodes


def test_different_roles_are_not_merged() -> None:
    memory = AssociativeMemory(merge_threshold=0.0)
    user = memory.add("My name is Sasha", meta={"role": "user"})
    assistant = memory.add("My name is Sasha", meta={"role": "assistant"})
    memory.sleep(max_syntheses=0)
    assert user.id in memory.nodes
    assert assistant.id in memory.nodes
''', encoding="utf-8")

          tests = Path("tests/test_agent.py")
          tests.write_text(tests.read_text(encoding="utf-8") + r'''


def test_storage_path_autoloads_existing_graph(tmp_path: Path) -> None:
    path = tmp_path / "memory.sqlite"
    first = MemoryAgent(lambda prompt: "answer", storage_path=path, sleep=SleepConfig.off())
    first.learn("Atlas uses PostgreSQL")
    first.close()
    second = MemoryAgent(lambda prompt: "answer", storage_path=path, sleep=SleepConfig.off())
    assert second.stats()["nodes_total"] >= 1
    second.close()


def test_assistant_responses_are_not_retrieved_by_default() -> None:
    agent = MemoryAgent(lambda prompt: "assistant answer", sleep=SleepConfig.off())
    agent.ask("hello")
    result = agent.ask_with_trace("assistant answer")
    assert all(hit.node.meta.get("role") != "assistant" for hit in result.memories)
    agent.close()
''', encoding="utf-8")
          PY

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest

      - name: Commit source changes
        shell: bash
        run: |
          rm -rf .github/patches
          rm -f .github/workflows/apply-safe-defaults.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use safe memory defaults and migrate legacy graphs"
          git push
