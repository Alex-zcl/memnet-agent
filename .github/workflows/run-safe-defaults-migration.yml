name: Run safe defaults migration

on:
  push:
    branches:
      - fix/safe-pruning-and-role-memory
    paths:
      - .github/workflows/run-safe-defaults-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Extract migration program
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-safe-defaults.yml').read_text(encoding='utf-8')
          start = source.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = source.index("          PY\n", start)
          lines = source[start:end].splitlines()
          program = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/migrate.py').write_text(program, encoding='utf-8')
          PY

      - name: Apply migration
        run: |
          python /tmp/migrate.py
          python - <<'PY'
          from pathlib import Path
          path = Path('src/memnet_agent/memory.py')
          text = path.read_text(encoding='utf-8')
          block = '''        if migrated:\n            now = memory._now(None)\n            for node in memory.nodes.values():\n                node.last_decayed = max(node.last_decayed, now)\n            memory.log.append("migrated legacy 0.1.x memory defaults to safe daily decay")\n'''
          first = text.find(block)
          second = text.find(block, first + len(block))
          if first < 0 or second < 0:
              raise SystemExit('Expected duplicate migration block was not found')
          text = text[:second] + text[second + len(block):]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest

      - name: Commit source changes
        shell: bash
        run: |
          rm -rf .github/patches
          rm -f .github/workflows/apply-safe-defaults.yml
          rm -f .github/workflows/run-safe-defaults-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use safe memory defaults and migrate legacy graphs"
          git push
